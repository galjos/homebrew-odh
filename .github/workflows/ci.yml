name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formula:
    name: Formula
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Tap
        run: brew tap galjos/odh "$GITHUB_WORKSPACE"

      - name: Style
        run: brew style galjos/odh/odh

      - name: Audit
        run: brew audit --strict --online galjos/odh/odh

      - name: Install
        run: brew install --build-from-source galjos/odh/odh

      - name: Test
        run: brew test galjos/odh/odh
